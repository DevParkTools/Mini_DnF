function qProg(q){

}
function qState(q){

}
function questKill(e){

 if(p.mcd>0)p.mcd--;
 if(p.inv>0)p.inv--;

 if(comboT>0&&--comboT===0)combo=0;
 switch(p.st){

   p.x+=MV.x*2.8;p.y+=MV.y*2.8*0.72;

   break;

  case 'atk':{

   if(p.t>=a.hit+3&&atkCancel(p))break;
   if(p.t>=a.len)p.st='idle';

  }
  case 'skill':{

   if(k===0){

    }
    if(p.t===13){p.aid++;strikeEnemies(p,110,56,40,3.0,{kx:6,launch:13,stun:16,hs:7,sh:6});arcFx(p,2);ringFx(p.x,p.y,20,110,10,'#9fe0ff',8);sfx.slam();}
    if(p.t>=SK[0].len)p.st='idle';
   }else if(k===1){
    if(p.t===6){
     p.vz=7.5;p.aid++;
     strikeEnemies(p,92,46,22,2.4,{kx:3,launch:15,stun:10,hs:6,sh:5});
     arcFx(p,4);sfx.swing();
    }
    if(p.t>6){p.vz-=GRAV;p.z+=p.vz;if(p.z<0){p.z=0;p.vz=0;}}
    if(p.t>=SK[1].len&&p.z<=0){p.z=0;p.vz=0;p.st='idle';}
   }else if(k>=3){
    csk(p,k);
   }else{
    if(p.t>=8&&p.t<=32&&p.t%6===2){
     p.aid++;
     strikeEnemies(p,125,60,125,0.9,{kx:1.5,launch:0,stun:12,hs:3,sh:2});
     ringFx(p.x,p.y,30,130,10,'#ffd27a',8);sfx.swing();
    }
    if(p.t===40){
     p.aid++;
     strikeEnemies(p,140,64,140,2.2,{kx:7,launch:13,stun:20,hs:8,sh:7});
     ringFx(p.x,p.y,40,160,14,'#fff2c0',12);sfx.slam();
    }
    if(p.t>=SK[2].len)p.st='idle';
   }
   break;
  }
  case 'jump':case 'jatk':{
   for(let i=0;i<5;i++)if(buf[SKK[i]]>0&&trySkill(i)){p.vz=0;break;}
   if(p.st==='skill')break;
   p.vz-=GRAV;p.z+=p.vz;
   p.x+=MV.x*2.2;p.y+=MV.y*1.4;
   if(p.st==='jump'){
    if(MV.x>0.1)p.dir=1;else if(MV.x<-0.1)p.dir=-1;
    if(buf.atk>0){buf.atk=0;p.st='jatk';p.t=0;sfx.swing();}
   }else{
    p.t++;
    if(p.t===3||p.t===9||p.t===15){
     p.aid++;
     strikeEnemies(p,80,44,16,0.9,{kx:2,launch:0,stun:12});
     arcFx(p,3);
    }
   }
   if(p.z<=0){p.z=0;p.vz=0;p.st='idle';dust(p.x,p.y);}
   break;
  }
  case 'dash':{
   p.t++;
   p.x+=p.dir*(9-p.t*0.45);p.y+=MV.y*1.2;
   if(p.t%3===0)dust(p.x,p.y);
   if(p.t>=7&&buf.atk>0){buf.atk=0;startAtk(p,0);break;}
   if(p.t>=16)p.st='idle';
   break;
  }
  case 'hurt':{
   p.t++;p.x+=p.vx;p.vx*=0.85;
   if(p.t>=p.stun){p.st='idle';p.inv=Math.max(p.inv,25);}
   break;
  }
  case 'air':{
   p.vz-=GRAV;p.z+=p.vz;p.x+=p.vx;p.vx*=0.985;
   if(p.z<=0){
    p.z=0;
    if(Math.abs(p.vz)>6&&!p.bounced){p.vz=-p.vz*0.35;p.bounced=true;p.z=0.01;shake=Math.max(shake,3);dust(p.x,p.y);}
    else{
     p.vz=0;p.vx=0;p.bounced=false;
     if(p.dying){p.st='dead';p.t=0;}else{p.st='down';p.t=0;}
    }
   }
   break;
  }
  case 'down':p.t++;if(p.t>=36){p.st='getup';p.t=0;}break;
  case 'getup':p.t++;p.inv=Math.max(p.inv,20);if(p.t>=14){p.st='idle';p.inv=70;}break;
  case 'dead':p.t++;if(p.t===70&&mode!=='over')showOver();break;
 }
 if(p.st==='idle'&&p.z>0){p.st='jump';p.vz=0;}
 const lim=mode==='town'?TOWN_W:ROOM_W;
 const maxX=(mode==='dungeon'&&D&&!D.cleared)?ROOM_W-110:lim-30;
 p.x=clamp(p.x,30,maxX);
 p.y=clamp(p.y,LANE_T+8,LANE_B);
}

function clampE(e){
 const lim=mode==='town'?TOWN_W:ROOM_W;
 e.x=clamp(e.x,30,lim-30);
 e.y=clamp(e.y,LANE_T+8,LANE_B);
}
function updEnemies(){
 ATKN=0;
 for(let i=0;i<E.length;i++)if(E[i].st==='atk'&&!E[i].boss)ATKN++;
 for(let i=E.length-1;i>=0;i--){
  const e=E[i];
  updEnemy(e);
  if(e.remove)E.splice(i,1);
 }
}
function stDot(e,d,c){
 e.hp-=d;txt(e.x,e.y,e.z+54,d,c,13);spark(e.x,e.y,e.z+rnd(14,50),2,c);
 if(e.hp<=0)killEnemy(e,1);
}
function stTick(e){
 if(e.dying||e.st==='dead'||e.dummy){e.shk=0;e.bld=0;e.bs=0;return;}
 if(e.shk>0){
  e.shk--;
  if(e.shk%20===0)stDot(e,Math.max(1,Math.round(atkFor()*0.22)),'#8fd0ff');
  else if(e.shk%6===0)spark(e.x,e.y,e.z+rnd(10,56),1,'#bfe8ff');
 }
 if(e.bld>0){
  e.bld--;
  if(e.bld%30===0){stDot(e,Math.max(1,Math.round(atkFor()*0.16*e.bs)),'#ff4a5a');}
  else if(e.bld%10===0)spark(e.x,e.y,e.z+rnd(10,56),1,'#c8283a');
  if(e.bld<=0)e.bs=0;
 }
}
function updEnemy(e){
 if(e.shk>0||e.bld>0)stTick(e);
 if(e.inv>0)e.inv--;
 if(e.flash>0)e.flash--;
 if(e.hit>0)e.hit--;
 switch(e.st){
  case 'dead':if(--e.fade<=0)e.remove=true;return;
  case 'air':
   e.vz-=GRAV;e.z+=e.vz;e.x+=e.vx;e.vx*=0.985;
   if(e.z<=0){
    e.z=0;
    if(Math.abs(e.vz)>6&&!e.bounced){e.vz=-e.vz*0.35;e.bounced=true;e.z=0.01;dust(e.x,e.y);}
    else if(e.dying){e.st='dead';e.fade=45;e.vx=0;e.vz=0;}
    else{e.st='down';e.stT=40;e.vx=0;e.vz=0;e.bounced=false;e.jug=0;}
   }
   clampE(e);return;
  case 'down':if(--e.stT<=0){e.st='getup';e.stT=16;e.inv=45;}return;
  case 'getup':if(--e.stT<=0){e.st='idle';e.cd=Math.max(e.cd,30);}return;
  case 'hurt':
   e.x+=e.vx;e.vx*=0.85;clampE(e);
   if(--e.stT<=0){e.st='idle';e.cd=Math.max(e.cd,25);}
   return;
 }
 if(e.dummy)return;
 aiEnemy(e);
 clampE(e);
}
function sep(e){
 for(let i=0;i<E.length;i++){
  const o=E[i];
  if(o===e||o.st==='dead')continue;
  const dx=e.x-o.x,dy=e.y-o.y;
  if(Math.abs(dx)<30&&Math.abs(dy)<12){e.x+=dx>=0?0.8:-0.8;e.y+=dy>=0?0.4:-0.4;}
 }
}
function aiEnemy(e){
 const t=e.t,dx=P.x-e.x,dy=P.y-e.y,adx=Math.abs(dx),ady=Math.abs(dy);
 if(!e.active){if(adx<600||e.boss)e.active=true;else return;}
 if(e.cd>0)e.cd--;
 if(P.st==='dead'||P.dying){e.mv=false;return;}
 if(e.st!=='atk')e.dir=dx>=0?1:-1;
 switch(t.ai){
  case 'melee':aiMelee(e,dx,dy,adx,ady);break;
  case 'range':aiRange(e,dx,dy,adx,ady);break;
  case 'boss1':aiBoss1(e,dx,dy,adx,ady);break;
  case 'boss2':aiBoss2(e,dx,dy,adx,ady);break;
 }
}
function aiMelee(e,dx,dy,adx,ady){
 const t=e.t;
 if(e.st==='atk'){
  e.stT++;
  if(e.stT===t.wu){strikeP(e,t.rng,t.dmg,t.armor?10:0);e.x+=e.dir*8;}
  if(e.stT>=t.wu+t.rec){e.st='idle';e.cd=rndi(45,100);}
  return;
 }
 const want=t.rng*0.75;
 let mx=0,my=0;
 if(adx>want)mx=dx>0?1:-1;
 if(ady>10)my=dy>0?1:-1;
 e.mv=mx!==0||my!==0;
 e.x+=mx*t.spd;e.y+=my*t.spd*0.7;
 if(e.mv)e.walkT++;
 if(adx<=t.rng&&ady<=22&&e.cd<=0&&ATKN<2){e.st='atk';e.stT=0;e.mv=false;ATKN++;}
 sep(e);
}
function aiRange(e,dx,dy,adx,ady){

 if(e.st==='atk'){

   sfx.bow();
  }
  if(e.stT>=t.wu+t.rec){e.st='idle';e.cd=rndi(70,130);}
  return;
 }
 const pref=t.rng*0.62;
 let mx=0,my=0;
 if(adx<pref-70)mx=dx>0?-1:1;else if(adx>pref+60)mx=dx>0?1:-1;
 if(ady>12)my=dy>0?1:-1;
 e.mv=mx!==0||my!==0;
 e.x+=mx*t.spd;e.y+=my*t.spd*0.8;
 if(e.mv)e.walkT++;
 if(e.cd<=0&&ady<=24&&adx<t.rng&&adx>110){e.st='atk';e.stT=0;e.mv=false;}
 sep(e);

function bossStart(e,m){e.st='atk';e.mv=false;e.am=m;e.stT=0;e.hitDone=false;e.cy=P.y;}
function endBoss(e,cd){e.st='idle';e.cd=cd;e.am='';}
function aiBoss1(e,dx,dy,adx,ady){
 const t=e.t;
 if(e.st==='atk'){boss1Atk(e);return;}
 if(e.hp<e.maxHp*0.66&&e.ph<1){e.ph=1;bossStart(e,'roar');return;}
 if(e.hp<e.maxHp*0.33&&e.ph<2){e.ph=2;bossStart(e,'roar');return;}
 let mx=0,my=0;
 if(adx>110)mx=dx>0?1:-1;
 if(ady>12)my=dy>0?1:-1;
 e.mv=mx!==0||my!==0;
 e.x+=mx*t.spd*(1+e.ph*0.15);e.y+=my*t.spd*0.7;
 if(e.mv)e.walkT++;
 if(e.cd<=0){
  const r=Math.random();
  if(adx<150&&ady<36)bossStart(e,r<0.45?'swing':(r<0.8?'slam':'charge'));
  else if(adx<420)bossStart(e,r<0.5?'charge':'slam');
  else bossStart(e,'charge');
 }
}
function boss1Atk(e){
 const t=e.t;
 e.stT++;
 switch(e.am){
  case 'swing':
   if(e.stT===24){strikeP(e,110,t.dmg,9);e.x+=e.dir*14;}
   if(e.stT>=52)endBoss(e,50);
   break;
  case 'slam':
   if(e.stT===46){ringAoe(e.x+e.dir*50,e.y,250,t.dmg+6,12,'#ffb36a');sfx.slam();}
   if(e.stT>=88)endBoss(e,60);
   break;
  case 'charge':
   if(e.stT<34){e.dir=P.x>=e.x?1:-1;e.cy=P.y;}
   else if(e.stT<64){
    e.x+=e.dir*10.5;e.y+=clamp(e.cy-e.y,-2,2);
    if(!e.hitDone){
     const ddx=P.x-e.x,ddy=P.y-e.y;
     if(Math.abs(ddx)<60&&Math.abs(ddy)<30&&P.z<40){dmgPlayer(t.dmg+8,e.x,13);e.hitDone=true;}
    }
    if(e.stT%4===0)dust(e.x,e.y);
   }
   if(e.stT>=110)endBoss(e,40);
   break;
  case 'roar':
   if(e.stT===40){shake=8;summon(e,e.t.sm||'goblin',2);sfx.roar();}
   if(e.stT>=84)endBoss(e,30);
   break;
 }
}
function aiBoss2(e,dx,dy,adx,ady){
 const t=e.t;
 e.z=22+Math.sin(time*0.05)*8;
 if(e.st==='atk'){boss2Atk(e);return;}
 if(e.hp<e.maxHp*0.66&&e.ph<1){e.ph=1;bossStart(e,'summon');return;}
 if(e.hp<e.maxHp*0.33&&e.ph<2){e.ph=2;bossStart(e,'summon');return;}
 let mx=0,my=0;
 if(adx<240)mx=dx>0?-1:1;else if(adx>380)mx=dx>0?1:-1;
 if(ady>14)my=dy>0?1:-1;
 e.mv=mx!==0||my!==0;
 e.x+=mx*t.spd;e.y+=my*t.spd*0.7;
 if(e.mv)e.walkT++;
 if(e.cd<=0){
  const r=Math.random();
  if(adx<170)bossStart(e,r<0.5?'blink':(e.ph>=1?'nova':'pillars'));
  else bossStart(e,r<0.4?'orbs':(r<0.8?'pillars':(e.ph>=1?'nova':'orbs')));
 }
}
function boss2Atk(e){
 const t=e.t;
 e.stT++;
 switch(e.am){
  case 'orbs':
   if(e.stT===30){
    const n=e.ph>=1?5:3,base=clamp((P.y-e.y)/70,-1.4,1.4);
    for(let i=0;i<n;i++)PR.push({k:'orb',x:e.x+e.dir*30,y:e.y,z:e.z+40,vx:e.dir*5,vy:base+(i-(n-1)/2)*0.55,dir:e.dir,dmg:t.dmg*0.8,life:160});
    sfx.wave();
   }
   if(e.stT>=62)endBoss(e,55);
   break;
  case 'pillars':
   if(e.stT===30){
    const n=e.ph>=1?6:4;
    for(let i=0;i<n;i++){
     const px=i===0?P.x:clamp(P.x+rnd(-220,220),50,ROOM_W-50);
     const py=i===0?P.y:clamp(P.y+rnd(-70,70),LANE_T+10,LANE_B);
     PR.push({k:'pillar',x:px,y:py,r:54,t:0,d:48,dmg:t.dmg,life:66,hit:false});
    }
   }
   if(e.stT>=80)endBoss(e,60);
   break;
  case 'blink':
   if(e.stT<18){e.fadeA=1-e.stT/18;e.inv=2;}
   else if(e.stT===18){
    const side=Math.random()<0.5?-1:1;
    e.x=clamp(P.x+side*150,60,ROOM_W-60);e.y=P.y;e.dir=P.x>=e.x?1:-1;e.inv=2;
   }
   else if(e.stT<32){e.fadeA=(e.stT-18)/14;e.inv=2;}
   else e.fadeA=1;
   if(e.stT===36){strikeP(e,130,t.dmg,10);}
   if(e.stT>=64){e.fadeA=1;endBoss(e,45);}
   break;
  case 'nova':
   if(e.stT===50){ringAoe(e.x,e.y,280,t.dmg+4,12,'#9fe3ff');sfx.slam();}
   if(e.stT>=90)endBoss(e,60);
   break;
  case 'summon':
   if(e.stT===40){shake=6;summon(e,e.t.sm||'skel',2);sfx.roar();}
   if(e.stT>=80)endBoss(e,40);
   break;
 }
}

function updProj(){
 const lim=mode==='town'?TOWN_W:ROOM_W;
 for(let i=PR.length-1;i>=0;i--){
  const q=PR[i];
  q.life--;
  switch(q.k){
   case 'wave':
    q.x+=q.vx;
    for(let j=0;j<E.length;j++){
     const e=E[j];
     if(!hittable(e)||q.hits.indexOf(e)>=0||(e.st==='down'&&q.z>24))continue;
     if(Math.abs(e.x-q.x)<e.r+22&&Math.abs(e.y-q.y)<36&&Math.abs(e.z-q.z+20)<90){
      q.hits.push(e);
      hurtEnemy(e,q.mul,{kx:3,launch:0,stun:14,hs:3,sh:2},q.x-q.dir*40);
     }
    }
    break;
   case 'arrow':case 'orb':
    q.x+=q.vx;q.y+=q.vy||0;
    if(Math.abs(q.x-P.x)<18&&Math.abs(q.y-P.y)<22&&Math.abs(q.z-(P.z+30))<44){
     dmgPlayer(q.dmg*rnd(0.95,1.05),q.x-q.vx*4,q.k==='orb'?9:0);
     spark(q.x,q.y,q.z,6,q.k==='orb'?'#bff2ff':'#ffe0a0');
     q.life=0;
    }
    if(q.x<0||q.x>lim)q.life=0;
    break;
   case 'pillar':
    q.t++;
    if(q.t===q.d){
     shake=Math.max(shake,5);
     if(!q.hit&&P.z<40&&Math.abs(P.x-q.x)<q.r&&Math.abs(P.y-q.y)<q.r*0.5){dmgPlayer(q.dmg,q.x,12);q.hit=true;}
    }
    break;
   case 'ring':
    q.r+=q.maxR/24;
    if(!q.hit&&P.z<28){
     const d=Math.hypot(P.x-q.x,(P.y-q.y)*2);
     if(Math.abs(d-q.r)<28){dmgPlayer(q.dmg,q.x,q.launch);q.hit=true;}
    }
    break;
  }
  if(q.life<=0)PR.splice(i,1);
 }
}
function updDrops(){

 for(let i=DR.length-1;i>=0;i--){
  const d=DR[i];

  if(d.z<=0){d.z=0;if(d.vz<-2)d.vz=-d.vz*0.4;else{d.vz=0;d.vx=0;d.vy=0;}}
  if(d.t>25&&P.st!=='dead'&&!P.dying){
   const dx=P.x-d.x,dy=P.y-d.y,dist=Math.hypot(dx,dy*1.6);
   if(dist<(mag?99999:90)){d.x+=dx*0.18;d.y+=dy*0.18;}
   if(dist<22){pickup(d);DR.splice(i,1);}
  }
 }
}
function updFx(){
 for(let i=PT.length-1;i>=0;i--){

  if(q.life<=0)TX.splice(i,1);
 }
 if(banner&&--banner.life<=0)banner=null;
 for(let i=toasts.length-1;i>=0;i--)if(--toasts[i].life<=0)toasts.splice(i,1);
}

function updDungeon(){

function rayFx(x,y,z,n,r0,r1,w,life,c){

  const a=i/(n-1)*Math.PI,cs=Math.cos(a),sn=Math.sin(a);

function drawBm(q){

  return;
 }
 const u=1-q.life/q.max;
 const x0=lxp(q.x),y0=lyp(q.y-q.z),x1=lxp(q.x+q.dx),y1=lyp(q.y+q.dy-q.z-q.dz);
 const head=Math.min(1,u*3.5),tail=Math.max(0,(u-0.25)*1.3);
 const ex=x0+(x1-x0)*head,ey=y0+(y1-y0)*head,sx=x0+(x1-x0)*tail,sy=y0+(y1-y0)*tail;
 const n=Math.round(Math.max(Math.abs(ex-sx),Math.abs(ey-sy)));
 if(n<2)return;
 lx.globalAlpha=Math.round(clamp(q.life/q.max*1.6,0,1)*4)/4;
 const fade=1-u*0.5;
 for(let i=0;i<=n;i++){
  const t=i/n,wv=Math.max(1,Math.round(q.w*1.7*Math.sin(Math.PI*Math.min(1,t*0.9+0.1))*fade));
  const px=Math.round(sx+(ex-sx)*t),py=Math.round(sy+(ey-sy)*t),h=wv>>1;
  lx.fillStyle=q.c;lx.fillRect(px-h,py-h,wv,wv);
  const cw=Math.max(1,wv>>1);
  lx.fillStyle=q.core;lx.fillRect(px-(cw>>1),py-(cw>>1),cw,cw);
 }
 lx.globalAlpha=1;
}

const C32={};
const SHD={};
function c32(h){
 let v=C32[h];
 if(v!==undefined)return v;
 let r,g,b;
 if(h.length===4){r=parseInt(h[1]+h[1],16);g=parseInt(h[2]+h[2],16);b=parseInt(h[3]+h[3],16);}
 else{r=parseInt(h.substr(1,2),16);g=parseInt(h.substr(3,2),16);b=parseInt(h.substr(5,2),16);}
 v=((255<<24)|(b<<16)|(g<<8)|r)>>>0;
 C32[h]=v;
 return v;
}
function h2(n){return (n<16?'0':'')+n.toString(16);}
function shd(h,f){
 const k=h+f;
 let v=SHD[k];
 if(v!==undefined)return v;
 const c=c32(h);
 let r=c&255,g=(c>>8)&255,b=(c>>16)&255;
 if(f>=1){const t=f-1;r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t;}
 else{r*=f;g*=f;b*=f;}
 v='#'+h2(Math.round(r))+h2(Math.round(g))+h2(Math.round(b));
 SHD[k]=v;
 return v;
}
function mixH(a,b,t){
 const k=a+b+t;
 let v=SHD[k];
 if(v!==undefined)return v;
 const ca=c32(a),cb=c32(b);
 const r=(ca&255)*(1-t)+(cb&255)*t,g=((ca>>8)&255)*(1-t)+((cb>>8)&255)*t,bl=((ca>>16)&255)*(1-t)+((cb>>16)&255)*t;
 v='#'+h2(Math.round(r))+h2(Math.round(g))+h2(Math.round(bl));
 SHD[k]=v;
 return v;
}

const PX=new Float32Array(24),PY=new Float32Array(24),XI=new Float32Array(24);
let PN=0;
function pv(x,y){PX[PN]=x;PY[PN]=y;PN++;}
function spans(cb){
 let mn=1e9,mx=-1e9;
 for(let i=0;i<PN;i++){const y=PY[i];if(y<mn)mn=y;if(y>mx)mx=y;}
 const y0=Math.ceil(mn-0.5),y1=Math.ceil(mx-0.5)-1;
 for(let y=y0;y<=y1;y++){
  const yc=y+0.5;
  let n=0;
  for(let i=0;i<PN;i++){
   const j=i+1===PN?0:i+1;
   const ya=PY[i],yb=PY[j];
   if((ya<=yc&&yb>yc)||(yb<=yc&&ya>yc))XI[n++]=PX[i]+(yc-ya)/(yb-ya)*(PX[j]-PX[i]);
  }
  for(let a=1;a<n;a++){const v=XI[a];let b=a-1;while(b>=0&&XI[b]>v){XI[b+1]=XI[b];b--;}XI[b+1]=v;}
  for(let k=0;k+1<n;k+=2){
   const xa=Math.ceil(XI[k]-0.5),xb=Math.ceil(XI[k+1]-0.5)-1;
   if(xb>=xa)cb(y,xa,xb);
  }
 }
}

function mPop(){MP--;const o=MP*6;ma=MS[o];mb=MS[o+1];mc=MS[o+2];md=MS[o+3];me=MS[o+4];mf=MS[o+5];}

 ma=na;mb=nb;mc=nc;md=nd;

function pxDisc(c2,cx,cy,r,cell,col){
 c2.fillStyle=col;
 const n=Math.round(r/cell);
 for(let j=-n;j<=n;j++){
  const w=Math.floor(Math.sqrt(n*n+n*0.6-j*j));
  c2.fillRect(cx+(-w)*cell,cy+j*cell,(w*2+1)*cell,cell);
 }
}
function pxPie(c2,cx,cy,r,cell,frac,col){
 c2.fillStyle=col;
 const n=Math.round(r/cell),start=-Math.PI/2,end=start+TAU*frac;
 for(let j=-n;j<=n;j++)for(let i=-n;i<=n;i++){
  if(i*i+j*j>n*n)continue;
  let a=Math.atan2(j,i);
  if(a<start)a+=TAU;
  if(a<=end)c2.fillRect(cx+i*cell-cell/2,cy+j*cell-cell/2,cell,cell);
 }
}

 ctx.fillStyle=col;
 ctx.fillText(s,x,y);
 ctx.textBaseline='alphabetic';
}

function drawTFx(){

  const q=tFx[i];q.life--;
  if(q.life<=0){tFx.splice(i,1);continue;}
  const u=1-q.life/q.max,head=Math.min(1,u*3.5),tail=Math.max(0,(u-0.25)*1.3);
  const ex=q.x0+(q.x1-q.x0)*head,ey=q.y0+(q.y1-q.y0)*head,sx=q.x0+(q.x1-q.x0)*tail,sy=q.y0+(q.y1-q.y0)*tail;

  for(let k=0;k<=n;k++){
   const t=k/n,wv=Math.max(1,Math.round(q.w*Math.sin(Math.PI*Math.min(1,t*0.9+0.1))*(1-u*0.5))),h=wv>>1;
   const px=Math.round(sx+(ex-sx)*t),py=Math.round(sy+(ey-sy)*t),cw=Math.max(1,wv>>1);
   lx.fillStyle=q.c;lx.fillRect(px-h,py-h,wv,wv);

 }

  nrect('#0c0814',px+pw-62,ey-2,52,50);nrect('#3a4a86',px+pw-61,ey-1,50,48);nrect('#161e3c',px+pw-60,ey,48,46);
  lx.save();lx.beginPath();lx.rect(px+pw-60,ey,48,46);lx.clip();
  const sv=HERO.c1;HERO.c1=['#2f6bd1','#2f9ad1','#d1a02f'][save.eq.a?save.eq.a.g:0];
  drawPortraitPx(HERO,px+pw-36,ey+22);HERO.c1=sv;
  lx.restore();
 }
 const gx=px+10,gy=py+96,cs=30,gp=3,cols=5;
 for(let i=0;i<20;i++){
  const x=gx+(i%cols)*(cs+gp),y=gy+Math.floor(i/cols)*(cs+gp),it=save.inv[i];
  if(it)iconPx(it,x,y,cs);
  else{nrect('#0c0814',x,y,cs,cs);nrect('#1c2548',x+1,y+1,cs-2,cs-2);nrect('#0e1428',x+2,y+2,cs-4,cs-4);}
  if(invUI.sel===i){lx.fillStyle='#ffe27a';lx.fillRect(x-1,y-1,cs+2,1);lx.fillRect(x-1,y+cs,cs+2,1);lx.fillRect(x-1,y-1,1,cs+2);lx.fillRect(x+cs,y-1,1,cs+2);}
  if(it)cellHit(x,y,cs,cs,()=>{sfx.ui();invUI.sel=i;});
 }
 const gw=cols*(cs+gp)-gp;
 const wide=pw>=300;
 const dx=wide?gx+gw+10:gx,dy=wide?gy:gy+4*(cs+gp)+2,dw=wide?pw-20-gw-10:pw-20,dh=wide?4*(cs+gp)-gp:py+ph-dy-6;
 nrect('#0c0814',dx,dy,dw,dh);nrect('#3a4a86',dx+1,dy+1,dw-2,dh-2);nrect('#0e1428',dx+2,dy+2,dw-4,dh-4);
 let it=null,eqd=false;
 if(invUI.sel>=0)it=save.inv[invUI.sel]||null;
 else if(invUI.sel===-2){it=save.eq.w;eqd=true;}
 else if(invUI.sel===-3){it=save.eq.a;eqd=true;}
 if(!it){
  ptx('아이템을 선택하세요',dx+(dw>>1),dy+(dh>>1)+3,'#6a78b0','center',1,false,false);
  uiPrimary=()=>{invUI=null;openPause();};
  return;
 }
 ptx(it.n,dx+6,dy+14,GCOL[it.g],'left',1,false,true);
 ptx('['+GN[it.g]+'] '+(it.s==='w'?'공격력 +':'체력 +')+it.v,dx+6,dy+28,'#ffffff','left',1,false,true);
 if(!eqd){
  const cur=save.eq[it.s],df=it.v-(cur?cur.v:0);
  ptx('장착 중 대비 '+(df>=0?'+':'')+df,dx+6,dy+42,df>=0?'#7dff8a':'#ff7a7a','left',1,false,true);
  const by=dy+dh-22;
  const eqf=()=>{sfx.ui();invEquipSel(it);};
  uiBtn(dx+4,by,(dw>>1)-6,18,'장착',eqf,true);
  uiBtn(dx+(dw>>1),by,(dw>>1)-4,18,'판매 '+it.v*3+'G',()=>invSell(it),false);
  uiPrimary=eqf;
 }else{
  const by=dy+dh-22;
  uiBtn(dx+4,by,dw-8,18,'해제',()=>{
   if(save.inv.length>=20){toast('가방이 가득 찼습니다');return;}
   save.inv.push(it);save.eq[it.s]=null;writeSave();applyEq();invUI.sel=-1;sfx.ui();
  },false);
  uiPrimary=()=>{invUI=null;openPause();};
 }
}

function iconShop(ic,x,y,s){
 nrect('#0c0814',x,y,s,s);nrect('#6f84c8',x+1,y+1,s-2,s-2);nrect('#161e3c',x+2,y+2,s-4,s-4);
 const cx=x+(s>>1),cy=y+(s>>1);
 if(ic==='pot'||ic==='mpot'){
  const c=ic==='pot'?'#e04a5a':'#4a8ae8',cl=ic==='pot'?'#ff9aa8':'#9ac8ff';
  lx.fillStyle='#d8dde6';lx.fillRect(cx-2,cy-9,4,4);lx.fillStyle='#8a6a3a';lx.fillRect(cx-3,cy-10,6,2);
  lx.fillStyle=c;lx.fillRect(cx-6,cy-4,12,12);lx.fillRect(cx-4,cy-5,8,1);lx.fillRect(cx-4,cy+8,8,1);
  lx.fillStyle=cl;lx.fillRect(cx-5,cy-3,2,7);
 }else if(ic==='enh'){
  lx.fillStyle='#8a929e';lx.fillRect(cx-9,cy-2,18,5);lx.fillRect(cx-5,cy+3,10,4);lx.fillRect(cx-6,cy-6,12,4);
  lx.fillStyle='#c8d0dc';lx.fillRect(cx-9,cy-2,18,1);lx.fillRect(cx-6,cy-6,12,1);
  lx.fillStyle='#ffb35a';lx.fillRect(cx+2,cy-10,3,3);
 }else if(ic==='scr'){
  lx.fillStyle='#e8d8a8';lx.fillRect(cx-8,cy-6,16,12);lx.fillStyle='#b89a5a';lx.fillRect(cx-9,cy-7,2,14);lx.fillRect(cx+7,cy-7,2,14);
  lx.fillStyle='#a83a3a';lx.fillRect(cx-2,cy-2,4,4);
 }else{
  lx.fillStyle='#8a5a2c';lx.fillRect(cx-7,cy-4,14,11);lx.fillStyle='#a8743c';lx.fillRect(cx-7,cy-4,14,3);
  lx.fillStyle='#c9a227';lx.fillRect(cx-1,cy,2,3);lx.fillStyle='#5a3a1c';lx.fillRect(cx-4,cy-7,8,3);
 }
}
function drawShop(){
 dimAll(0.62);
 fullHit(()=>{});
 const n=shopUI.n,its=shopItems(n);
 if(shopUI.sel>=its.length)shopUI.sel=0;
 const pw=Math.min(LW-8,310),ph=Math.min(LH-8,230),px=(LW-pw)>>1,py=(LH-ph)>>1;
 pPanel(px,py,pw,ph);
 ptx(n.n+' 상점',px+10,py+17,'#ffffff','left',1,true,true);
 ptx(save.gold+' G',px+pw-56,py+17,'#ffe27a','right',1,false,true);
 uiBtn(px+pw-46,py+5,38,16,'닫기',()=>{sfx.ui();shopUI=null;},false);
 const wide=pw>=300,lx0=px+10,ly0=py+28,lw=wide?112:pw-20,rh=30;
 for(let i=0;i<its.length;i++){
  const y=ly0+i*(rh+2),sel=i===shopUI.sel;
  nrect('#0c0814',lx0,y,lw,rh);nrect(sel?'#ffe27a':'#3a4a86',lx0+1,y+1,lw-2,rh-2);nrect(sel?'#3d56a0':'#121830',lx0+2,y+2,lw-4,rh-4);
  iconShop(its[i].ic,lx0+3,y+3,rh-6);
  ptx(its[i].nm,lx0+rh+2,y+(rh>>1)+4,'#ffffff','left',1,false,false);
  cellHit(lx0,y,lw,rh,()=>{sfx.ui();shopUI.sel=i;});
 }
 const it=its[shopUI.sel];
 const dx=wide?lx0+lw+8:lx0,dy=wide?ly0:ly0+its.length*(rh+2)+4,dw=wide?pw-20-lw-8:pw-20,dh=wide?ph-28-24:py+ph-dy-24;
 nrect('#0c0814',dx,dy,dw,dh);nrect('#3a4a86',dx+1,dy+1,dw-2,dh-2);nrect('#0e1428',dx+2,dy+2,dw-4,dh-4);
 ptx(it.nm,dx+6,dy+15,'#ffe27a','left',1,false,true);
 for(let i=0;i<it.d.length;i++)ptx(it.d[i],dx+6,dy+30+i*13,'#ffffff','left',1,false,true);
 const nb=it.b.length,bw=Math.floor((dw-8-(nb-1)*4)/nb),by=dy+dh-22;
 for(let i=0;i<nb;i++){const f=it.b[i].f;uiBtn(dx+4+i*(bw+4),by,bw,18,it.b[i].t,()=>{sfx.ui();f();},i===0);}
 uiPrimary=()=>{it.b[0].f();};
 if(shopUI.mt>0){shopUI.mt--;ptx(shopUI.msg,px+(pw>>1),py+ph-8,'#9fe0ff','center',1,false,true);}
}

 HERO.scarf=['#d63a3a','#3ad6ff','#ff7a2a','#e8d070'][c];
 HERO.hair=['#3a2a66','#2a3a8a','#8a1a1a','#4a4a60'][c];
 HERO.cape=['','#2a4aa0','#8a2a1a','#4a5068'][c]||undefined;

function openQuestLog_(){openQuestLog();}
function openNewConfirm(){
 menu={title:'새로 시작할까요?',lines:['기존 저장 데이터가 삭제됩니다.'],sel:0,items:[
  {t:'취소',f:()=>{menu=null;}},
  {t:'새로 시작',f:()=>{menu=null;newGame();}}
 ]};
}
function newGame(){
 save=defSave();save.started=true;writeSave();P=null;
 startTown(110);
 say('나레이션',['오랜 평화를 깨고 대지의 균열에서 몬스터가 쏟아지기 시작했다.','검 한 자루를 든 당신은 변방 마을 에르덴에 도착했다.','머리 위 ! 표시가 있는 촌장에게 [대화] 버튼(PC는 Space키)으로 말을 걸어보자. 허수아비로 조작을 연습할 수도 있다.'],null);
}
let lastT=performance.now(),acc=0;
const DT=1000/60;
function loop(now){
 acc+=Math.min(100,now-lastT);lastT=now;
 while(acc>=DT){
  acc-=DT;
  if(playing())step();else time++;
 }
 try{draw();}catch(err){showErr(err);}
 requestAnimationFrame(loop);
}

function showErr(err){
 try{
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#300';ctx.fillRect(0,0,cv.width,Math.min(cv.height,140));
  ctx.fillStyle='#fff';ctx.font='14px sans-serif';
  const m=String(err&&err.stack||err).split('\n').slice(0,5);
  for(let i=0;i<m.length;i++)ctx.fillText(m[i].slice(0,120),8,22+i*20);
 }catch(e2){}
}
window.addEventListener('error',e=>showErr(e.error||e.message));
const fontReady=Promise.race([
 Promise.all([document.fonts.load('10px Galmuri9','던전'),document.fonts.load('12px Galmuri11','던전')]),
 new Promise(r=>setTimeout(r,2500))
]);
fontReady.then(()=>{
 layout();
 buildAssets();
 setInterval(bgmTick,50);
 requestAnimationFrame(loop);
});
